name = Python application test with Gihub Actions

on : [push]

jobs:
  build : 
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.10
      uses: actions/setup-python@v1
      with: 
        python-version: 3.10
    - name: Install dependencies
      run: |
        make install
    - name: Lint with pylint
      run: |
        make lint
    - name: Test with pyest
      run: |
        make test
    - name: Format with make
      run: |
        make format
